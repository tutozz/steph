<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=block">
<link rel="stylesheet" href="../readme-brand.css">
<style>body { background: rgb(255, 0, 254); }</style><style>
.chev { display: inline-grid; }
.chev i { display: block; }
.who .sq { width: 14px; height: 14px; background: var(--black); flex: none; }
.arrow { color: var(--neutral); }
</style>
</head><body><div class="card">
<div class="logo"><span>steph</span><span class="chev" style="grid-template-columns:repeat(3,9px);grid-auto-rows:9px"><i style="background:var(--lemon)"></i><i style="background:transparent"></i><i style="background:transparent"></i><i style="background:transparent"></i><i style="background:var(--lemon)"></i><i style="background:transparent"></i><i style="background:var(--lemon)"></i><i style="background:transparent"></i><i style="background:transparent"></i></span></div>
<div class="bn">
  <div>
    <h1>Your terminal,<br><em>out loud.</em></h1>
    <p class="sub">steph listens to everything in your shell and says what matters, in one sentence. Designed and tested with people with low vision.</p>
    <p class="acro"><b>S</b>peaking <b>T</b>erminal, <b>E</b>verything <b>P</b>rivately <b>H</b>osted</p>
    <div class="chips"><span>Linux and macOS</span><span>100% local</span><span>Free for individuals</span></div>
  </div>
  <div class="art">
    <div class="term win"><div class="lines"><i style="width:72%"></i><i style="width:88%"></i><i style="width:54%"></i><i style="width:80%"></i><i style="width:66%"></i><i style="width:90%"></i><i style="width:48%"></i></div></div>
    <div class="say wave"><span class="chev" style="grid-template-columns:repeat(3,14px);grid-auto-rows:14px"><i style="background:var(--black)"></i><i style="background:transparent"></i><i style="background:transparent"></i><i style="background:transparent"></i><i style="background:var(--black)"></i><i style="background:transparent"></i><i style="background:var(--black)"></i><i style="background:transparent"></i><i style="background:transparent"></i></span></div>
  </div>
</div>
<style>
.logo { display: flex; align-items: center; gap: 12px; font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
.bn { display: grid; grid-template-columns: 1fr 200px; gap: 32px; align-items: end; margin-top: 20px; }
.bn h1 { margin-top: 0; font-size: 64px; line-height: 0.92; letter-spacing: -0.05em; }
.bn .sub { margin-top: 18px; }
.acro { margin: 12px 0 0; font-family: var(--mono); font-size: 19px; line-height: 1.4; color: var(--muted); }
.acro b { color: var(--lemon); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.chips span { font-family: var(--mono); font-size: 19px; font-weight: 500; line-height: 1; padding: 9px 12px; border: 2px solid var(--stroke); }
.art { position: relative; height: 290px; }
.win { position: absolute; left: 0; top: 0; width: 200px; height: 200px; }
.lines { display: grid; gap: 12px; padding: 24px 20px; }
.lines i { display: block; height: 8px; background: var(--neutral); }
.wave { position: absolute; right: 0; bottom: 0; width: 120px; height: 104px; display: grid; place-items: center; }
</style></div></body></html>
