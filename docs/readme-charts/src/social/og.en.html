<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=block">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
body { background-color: #0b0b0b; color: #f4f4f0;
  background-image: linear-gradient(#1a1a1a 1px, transparent 1px), linear-gradient(90deg, #1a1a1a 1px, transparent 1px);
  background-size: 32px 32px; font-family: "Space Grotesk", sans-serif; -webkit-font-smoothing: antialiased; }
.b { position: relative; height: 640px; padding: 56px 64px 0; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo b { font: 700 44px/1 "Space Grotesk"; letter-spacing: -0.04em; }
.chev { display: grid; }
.eyebrow { margin-top: 44px; font: 500 24px/1.4 "JetBrains Mono"; color: #e2ff3b; }
h1 { margin: 12px 0 0; font: 500 104px/0.92 "Space Grotesk"; letter-spacing: -0.05em; }
h1 em { font-style: normal; color: #e2ff3b; }
.sub { margin: 26px 0 0; max-width: 880px; font: 400 28px/1.4 "Space Grotesk"; color: #cfcfca; }
.foot { position: absolute; right: 64px; top: 64px; font: 500 22px "JetBrains Mono"; color: #cfcfca; }
.fringe { position: absolute; left: 0; right: 0; bottom: 0; display: flex; }
.fringe i { flex: 1; height: 40px; }
.fringe i.on { background: #e2ff3b; }
</style></head><body><div class="b">
<div class="logo"><b>steph</b><span class="chev" style="grid-template-columns:repeat(3,8px);grid-auto-rows:8px"><i style="background:#e2ff3b"></i><i></i><i></i><i></i><i style="background:#e2ff3b"></i><i></i><i style="background:#e2ff3b"></i><i></i><i></i></span></div>
<div class="foot">Linux and macOS · 100% local · steph.lsmdx.com</div>
<div class="eyebrow">Talking terminal</div>
<h1>Your terminal,<br><em>out loud.</em></h1>
<p class="sub">steph listens to your shell and says what matters in each command, in one sentence.</p>
<div class="fringe"></div>
</div><script>
(() => {
  let s = 61 >>> 0;
  const rnd = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const row = document.querySelector('.fringe');
  for (let i = 0; i < 32; i++) {
    const on = i !== 0 && i !== 32 - 1 && rnd() < 0.62;
    const c = document.createElement('i'); if (on) c.className = 'on'; row.appendChild(c);
  }
})();
</script></body></html>
